name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Poetry Export Plugin
        run: poetry self add poetry-plugin-export

      - name: Install AI Service dependencies
        working-directory: apps/ai-service
        run: poetry install --no-interaction --no-root

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      - run: npx nx affected -t lint test build typecheck --no-cloud --exclude='@gitcode/ai-service'
        env:
          AUTH_DATABASE_URL: 'postgres://auth_user:auth_password@localhost:5432/auth_db'
          PROBLEM_DATABASE_URL: 'postgres://problem_user:problem_password@localhost:5432/problem_db'
          NOTIFICATION_DATABASE_URL: 'postgres://notification_user:notification_password@localhost:5434/notification_db'
          GITHUB_DATABASE_URL: 'postgres://github_user:github_password@localhost:5435/github_db'
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
