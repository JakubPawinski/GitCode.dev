name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Poetry Export Plugin
        run: poetry self add poetry-plugin-export

      - name: Install AI Service dependencies
        working-directory: apps/ai-service
        run: poetry install --no-interaction --no-root

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint test build typecheck --no-cloud --parallel --max-parallel=5
        env:
          AUTH_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db'
          PROBLEM_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db'
          NOTIFICATION_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db'
          GITHUB_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db'
          ACHIEVEMENT_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db'
      - run: npx nx fix-ci
        if: always()
