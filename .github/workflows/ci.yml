name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup test environment variables
        run: cp .env.test .env

      - name: Create databases
        run: |
          for db in auth_db problem_db notification_db github_db achievement_db; do
            PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "CREATE DATABASE $db;" || true
          done

      - name: Prepare python environment
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry self add poetry-plugin-export

      - name: Install dependencies
        run: |
          npm ci
          cd apps/ai-service
          poetry install --no-interaction --no-root

      - name: Generate Prisma client
        run: npx nx run-many -t prisma-generate --no-cloud

      - name: Push Prisma schemas to databases
        run: npx nx run-many -t prisma-db-push --no-cloud

      - name: Set SHAs for affected projects
        uses: nrwl/nx-set-shas@v4

      - name: Run affected tests and linters
        run: npx nx affected -t lint test build typecheck --parallel --max-parallel=5 --no-cloud

      - name: Fix CI issues
        run: npx nx fix-ci
        if: always()
