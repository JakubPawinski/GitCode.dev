[tool.coverage.run]
branch = true
source = [ "ai_service" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=70 --cov-report html:'../../coverage/apps/ai-service/html' --cov-report xml:'../../coverage/apps/ai-service/coverage.xml' --junitxml='../../reports/apps/ai-service/unittests/junit.xml' --html='../../reports/apps/ai-service/unittests/html/index.html'"

[tool.poetry]
name = "ai-service"
version = "1.0.0"
description = ""
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "app"

  [tool.poetry.dependencies]
  python = "^3.12"
  fastapi = "^0.128.0"
  uvicorn = "^0.40.0"
  datamodel-code-generator = {extras = ["ruff"], version = "^0.53.0"}
  pydantic-settings = "^2.12.0"
  aio-pika = "^9.5.8"
  google-genai = "^1.60.0"
  sqlmodel = "^0.0.31"
  asyncpg = "^0.31.0"
  alembic = "^1.18.3"
  greenlet = "^3.3.1"
  psycopg2 = "^2.9.11"
  pyjwt = "^2.11.0"



[build-system]
requires = ["poetry-core==1.1.0"]
build-backend = "poetry.core.masonry.api"
