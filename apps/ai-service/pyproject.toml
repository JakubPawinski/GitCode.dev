[tool.coverage.run]
branch = true
source = [ "app" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov-fail-under=70 --cov-report html:'./test-output/coverage/html' --cov-report xml:'./test-output/coverage/coverage.xml' --junitxml='./test-output/unittests/junit.xml' --html='./test-output/unittests/html/index.html'"

[tool.poetry]
name = "ai-service"
version = "1.0.0"
description = ""
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "app"

  [tool.poetry.dependencies]
  python = "^3.12"
  fastapi = "^0.128.0"
  uvicorn = "^0.40.0"
  datamodel-code-generator = {extras = ["ruff"], version = "^0.53.0"}
  pydantic-settings = "^2.12.0"
  aio-pika = "^9.5.8"
  google-genai = "^1.60.0"
  sqlmodel = "^0.0.31"
  asyncpg = "^0.31.0"
  alembic = "^1.18.3"
  greenlet = "^3.3.1"
  psycopg2 = "^2.9.11"
  pyjwt = "^2.11.0"
  openai = "^2.23.0"



[build-system]
requires = ["poetry-core==1.1.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
