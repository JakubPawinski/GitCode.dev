http:
  routers:
    # Auth Routes
    auth-router:
      rule: PathPrefix(`/api/auth`)
      service: auth-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

    # User Routes
    user-route:
      rule: PathPrefix(`/api/user`)
      service: auth-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

    # Problem Routes
    problem-route:
      rule: PathPrefix(`/api/problems`)
      service: problem-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

      # GitHub Routes
    github-route:
      rule: PathPrefix(`/api/github`)
      service: github-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

    # Submission Routes
    submission-route:
      rule: PathPrefix(`/api/submissions`)
      service: problem-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api
    submission-ws-route:
      rule: PathPrefix(`/api/ws/submissions`)
      service: problem-service-ws
      entryPoints:
        - gateway
      middlewares:
        - strip-api-ws
      priority: 100

    # Social Routes
    social-route:
      rule: PathPrefix(`/api/social`)
      service: auth-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

    # Swagger Docs Route
    swagger-router:
      rule: PathPrefix(`/api/docs`)
      service: swagger-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

    notification-route:
      rule: PathPrefix(`/api/notifications`)
      service: notification-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

    ai-route:
      rule: PathPrefix(`/api/ai`)
      service: ai-service
      entryPoints:
        - gateway
      middlewares:
        - strip-api

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: 'http://host.docker.internal:4001'
    swagger-service:
      loadBalancer:
        servers:
          - url: 'http://host.docker.internal:4050'
    problem-service:
      loadBalancer:
        servers:
          - url: 'http://host.docker.internal:4002'
    problem-service-ws:
      loadBalancer:
        sticky:
          cookie:
            name: ws-sticky-cookie
            secure: false
            httponly: true
            sameSite: 'lax'
        servers:
          - url: 'http://host.docker.internal:4002'
    notification-service:
      loadBalancer:
        servers:
          - url: 'http://host.docker.internal:4003'
    github-service:
      loadBalancer:
        servers:
          - url: 'http://host.docker.internal:4004'
    ai-service:
      loadBalancer:
        servers:
          - url: 'http://host.docker.internal:4006'

  middlewares:
    strip-api:
      stripPrefix:
        prefixes:
          - '/api'
        forceSlash: false

    strip-api-ws:
      stripPrefix:
        prefixes:
          - '/api/ws/submissions'
        forceSlash: true
    auth-middleware:
      forwardAuth:
        address: 'http://auth-service:4001/verify-token'
        trustForwardHeader: true
        authResponseHeaders:
          - 'X-User-ID'
          - 'X-User-Email'
